name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # Pinned to a full commit SHA (v6.1.0) so the action cannot change under us
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Full history so SonarQube Cloud can use git blame and detect new code
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Locked versions with hashes, wheels only (no setup scripts run)
        run: pip install --only-binary ":all:" --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: pytest --cov=gradebook --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
