# SonarQube Cloud configuration
# Replace the two values below with the EXACT keys shown in SonarQube Cloud
# (Project > Information). Do NOT put your token in this file.
sonar.projectKey=cheryl3063_gradebook-sonar
sonar.organization=cheryl3063

# Application code that is analyzed for issues and coverage
sonar.sources=gradebook
# Test code: analyzed as tests, not counted as application code
sonar.tests=tests
# Sample data is not code
sonar.exclusions=data/**,**/__pycache__/**

# Python version used in CI, so rules are applied to the right syntax
sonar.python.version=3.12
# Coverage report produced by pytest-cov in the workflow
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
